# Semantic map for the Event Guide Robot demo.
#
# Coordinate source:
# - The original stand/zone points come from puntos.txt, captured in the ROS
#   "map" frame.
# - nav_goal/search_waypoints are safer stand-off poses selected on the map so
#   the robot center keeps at least ~0.40 m clearance from occupied pixels.
# - The centroid below is the average of the four measured stand/zone points.
# - yaw values were originally calculated toward the centroid, but final
#   orientation is intentionally relaxed in navigation_with_guide.launch via
#   move_base yaw_goal_tolerance. In tight spaces, the robot should arrive at
#   the x/y goal and keep whichever heading the local planner naturally used.
# - labels use ArUco/AprilTag-style numeric marker IDs as the primary visual
#   signal. Print one marker per stand and place it next to the human-readable
#   stand name. Colors can be added physically as a secondary debugging cue, but
#   they are not the semantic identifier.

metadata:
  frame_id: map
  map_file: ../../../../map.yaml
  position_source: puntos.txt_with_map_clearance_standoff
  yaw_source: face_original_zone_point_relaxed_by_move_base_yaw_goal_tolerance
  centroid:
    x: 0.13666607066988945
    y: 0.1921076737344265

zones:
  zona_arriba:
    name: "Zona arriba"
    aliases:
      - "arriba"
      - "zona arriba"
      - "punto arriba"
    nav_goal:
      x: 0.25
      y: -0.20
      yaw: 2.944685410850589
    search_waypoints:
      - x: 0.25
        y: -0.20
        yaw: 2.944685410850589
    labels:
